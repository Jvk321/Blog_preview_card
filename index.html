<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <article class="blog-card">
    <img class="ilustration" src="assets/images/illustration-article.svg" alt="a ilustration with a html closing tag and a background with shapes colored in yellow and black">
    <div class="container">
      <p class="tag">Learning</p>
      <p class="published-date">Published 21 Dec 2023</p>
      <p class="title"><a href="#">HTML & CSS foundations</a></p>
      <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>
    <div class="user">
      <img class="user-img" src="assets/images/image-avatar.webp" alt="user picture">
      <p class="user-name">Greg Hooper</p>
    </div>
  </article>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/Jvk321">Maurycy Górski</a>.
  </footer>
</body>
</html>
